services:
  mysql:
    image: mysql:8.0
    container_name: lingxi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: lingxi_agent
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./agent-service/sql/001_agent_core.sql:/docker-entrypoint-initdb.d/001_agent_core.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  business-service:
    build:
      context: ./business-service
      dockerfile: Dockerfile
    image: mewhelp-business-service:latest
    container_name: lingxi-business-service
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    image: mewhelp-agent-service:latest
    container_name: lingxi-agent-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      business-service:
        condition: service_started
    environment:
      BUSINESS_GRPC_TARGET: business-service:9090
      BUSINESS_GRPC_TIMEOUT_SECONDS: "5.0"
      DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:-123456}@mysql:3306/lingxi_agent?charset=utf8mb4
      CHECKPOINTER_DB_PATH: data/checkpoints.sqlite
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"
    volumes:
      - agent_data:/app/data

volumes:
  mysql_data:
  agent_data:
