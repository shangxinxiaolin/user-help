[project]
name = "lingxi-agent-service"
version = "0.1.0"
description = "Lingxi Customer Service Python Agent Service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-openai>=1.3",
    "langgraph>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
